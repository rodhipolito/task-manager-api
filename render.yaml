services:
- type: web
  name: taskly-api
  env: docker
  rootDir: TasklyApi
  dockerfilePath: Dockerfile          # como já tem rootDir, use o Dockerfile de lá
  plan: free
  autoDeploy: true
  envVars:
    - key: RENDER
      value: "true"
    - key: ASPNETCORE_ENVIRONMENT
      value: Production
    - key: JWT_KEY
      sync: false                      # setar no dashboard
    - key: DB_CONNECTION_STRING
      sync: false                      # setar no dashboard (sem aspas)
    - key: CORS_ALLOWED_ORIGINS        # troquei de CORS_ORIGIN -> CORS_ALLOWED_ORIGINS
      value: https://taskly-app.vercel.app,https://tickets-manager-api.vercel.app,http://localhost:5173
